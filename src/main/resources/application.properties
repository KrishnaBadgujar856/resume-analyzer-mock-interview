# Resume Analyzer & Mock Interview - Application Configuration
spring.application.name=resume-analyzer-mock-interview
server.port=${PORT:8085}

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_analyzer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Yash@5877}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=./uploads/resumes

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# AI Configuration (Optional External Provider; Demo Mode runs by default when blank)
app.ai.enabled=${AI_ENABLED:false}
app.ai.provider=${AI_PROVIDER:demo}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:demo}

# Management & Actuator
management.endpoints.web.exposure.include=health,info
