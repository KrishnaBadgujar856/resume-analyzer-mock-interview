<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview History — Resume Analyzer & Mock Interview</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="main-navbar"></nav>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Interview History</h1>
        <p class="page-subtitle">Track your performance trajectory and review past interview questions.</p>
      </div>
      <div>
        <a href="/interview-setup.html" class="btn btn-primary">+ New Mock Interview</a>
      </div>
    </div>

    <div id="alert-container"></div>

    <!-- Filter Bar -->
    <div class="card" style="margin-bottom: 1.5rem; padding: 1rem 1.25rem;">
      <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 220px;">
          <input type="text" id="role-filter" class="form-control" placeholder="Filter by target role (e.g. Java, Backend)...">
        </div>
        <div style="min-width: 160px;">
          <select id="status-filter" class="form-control">
            <option value="">All Statuses</option>
            <option value="COMPLETED">Completed</option>
            <option value="IN_PROGRESS">In Progress</option>
          </select>
        </div>
        <button id="filter-btn" class="btn btn-secondary">Apply Filters</button>
        <button id="reset-filter-btn" class="btn btn-secondary" style="display: none;">Reset</button>
      </div>
    </div>

    <!-- History Table -->
    <div class="card">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Target Role</th>
              <th>Resume</th>
              <th>Type & Level</th>
              <th>Questions</th>
              <th>Status</th>
              <th>Score</th>
              <th>Date</th>
              <th style="text-align: right;">Action</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <tr>
              <td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                Loading interview sessions...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div id="history-empty-container" style="display: none;"></div>
    </div>
  </main>

  <footer class="footer" id="main-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/interview-history.js"></script>
</body>
</html>
